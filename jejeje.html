<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡No me vais a ganar!</title>
    <style>
        /* Estilos globales */
        body {
            font-family: 'Courier New', Courier, monospace; /* Fuente estilo máquina de escribir, divertida */
            background-color: #3e2723; /* Marrón oscuro de fondo */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Para que las poops flotantes no creen barras de desplazamiento */
        }

        /* Contenedor principal */
        .contenedor {
            text-align: center;
            position: relative;
            z-index: 10; /* Asegura que el texto esté sobre las poops flotantes */
            background-color: rgba(255, 255, 255, 0.1); /* Fondo semi-transparente para el texto */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Título principal */
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: temblor 0.5s infinite; /* Animación de temblor */
        }

        /* Animación de temblor para el título */
        @keyframes temblor {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Subtítulo */
        p {
            font-size: 1.5rem;
            margin-top: 0;
            opacity: 0.8;
        }

        /* Poops flotantes de fondo */
        .poop-flotante {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2; /* Muy transparentes */
            animation: flotar linear infinite;
        }

        /* Animación para que las poops floten hacia arriba */
        @keyframes flotar {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        /* Generar múltiples poops con diferentes retrasos y posiciones */
        .poop-flotante:nth-child(1) { left: 10%; animation-duration: 15s; animation-delay: 0s; }
        .poop-flotante:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 2s; }
        .poop-flotante:nth-child(3) { left: 30%; animation-duration: 12s; animation-delay: 4s; }
        .poop-flotante:nth-child(4) { left: 40%; animation-duration: 20s; animation-delay: 1s; }
        .poop-flotante:nth-child(5) { left: 50%; animation-duration: 16s; animation-delay: 3s; }
        .poop-flotante:nth-child(6) { left: 60%; animation-duration: 14s; animation-delay: 5s; }
        .poop-flotante:nth-child(7) { left: 70%; animation-duration: 19s; animation-delay: 0.5s; }
        .poop-flotante:nth-child(8) { left: 80%; animation-duration: 17s; animation-delay: 2.5s; }
        .poop-flotante:nth-child(9) { left: 90%; animation-duration: 13s; animation-delay: 4.5s; }

    </style>
</head>
<body>

    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>
    <div class="poop-flotante">💩</div>

    <div class="contenedor">
        <h1>No me vais a ganar,</h1>
        <p>pero tiamo</p>
    </div>

</body>
</html>
