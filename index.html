<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Gis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(160deg, #1c1a33 0%, #241f3f 30%, #2c2749 55%, #342a4d 80%, #3a2d4f 100%);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .star {
    position: absolute;
    color: #fff;
    opacity: 0.6;
    animation: twinkle 3.6s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 0.65; transform: scale(1.1); }
  }

  .moon {
    position: absolute;
    top: 6%;
    right: 10%;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ece3d2;
    box-shadow: inset 9px -3px 0 0 #d8c9de;
    opacity: 0.85;
  }

  .book-shell {
    position: relative;
    width: 320px;
    height: 460px;
    perspective: 2200px;
  }

  .spine {
    position: absolute;
    left: -8px;
    top: 6px;
    bottom: 6px;
    width: 16px;
    border-radius: 8px 0 0 8px;
    background: #6b5b7a;
    box-shadow: inset -3px 0 6px rgba(0,0,0,0.18);
  }

  .paper-edge {
    position: absolute;
    right: -3px;
    top: 8px;
    bottom: 8px;
    width: 8px;
    background: repeating-linear-gradient(180deg, #e8dcc8 0px, #e8dcc8 2px, #dccbaf 2px, #dccbaf 4px);
    border-radius: 0 6px 6px 0;
  }

  .pages {
    position: absolute;
    inset: 0;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 6px 14px 14px 6px;
    background: #f3e9d7;
    box-shadow: 2px 4px 12px rgba(20,15,35,0.35);
    backface-visibility: hidden;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform 1s cubic-bezier(.65,.05,.36,1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 36px 30px;
    color: #5c4a48;
  }

  .card.flipped {
    transform: rotateY(-178deg);
  }

  .corner-heart {
    position: absolute;
    font-size: 14px;
    color: #c98fa0;
    opacity: 0.7;
  }
  .corner-heart.tl { top: 14px; left: 16px; }
  .corner-heart.br { bottom: 14px; right: 18px; }

  .opener {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    text-align: center;
    color: #7a4f5c;
    margin: 0 0 20px;
    line-height: 1.35;
  }

  .divider {
    text-align: center;
    color: #c98fa0;
    font-size: 14px;
    letter-spacing: 10px;
    margin: 0 0 22px;
  }

  .card p.body-text {
    font-size: 19px;
    line-height: 1.7;
    margin: 0 0 18px;
    text-align: left;
  }

  .card p.body-text:last-child { margin-bottom: 0; }

  .closing-page {
    align-items: center;
    text-align: center;
  }

  .closing {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    text-align: center;
    color: #7a4f5c;
    font-size: 22px;
    margin: 6px 0;
    line-height: 1.5;
  }

  .nav {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .nav-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #8a7a97;
    background: #4a3f5c;
    color: #e8dcec;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .nav-btn:active { transform: scale(0.9); }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
    box-shadow: none;
  }

  .dots {
    display: flex;
    gap: 9px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid #8a7a97;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .dot.active {
    background: #c98fa0;
    border-color: #c98fa0;
    transform: scale(1.25);
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="moon"></div>

  <div class="book-shell">
    <div class="spine"></div>
    <div class="paper-edge"></div>
    <div class="pages" id="pages"></div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" aria-label="Página anterior">&#10094;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Página siguiente">&#10095;</button>
  </div>
</div>

<script>
const pagesData = [
  {
    opener: "Te amo muchísimo, Gis.",
    paragraphs: [
      "Como te dije antes, eres MUY importante para mí, siempre vas a ser mi persona favorita y no sabría qué hacer sin ti."
    ]
  },
  {
    paragraphs: [
      "Honestamente, desde que hablamos más seguido, me siento mejor, porque me llena de felicidad saber que estás bien, saber de ti, etc.",
      "Aunque te tire mucho hate, es porque te amo demasiado, te adoro, te admiro, te aprecio, muchas cosas más, porque es mi forma de demostrarte lo importante que eres."
    ]
  },
  {
    paragraphs: [
      "Suena extraño que te lo diga, no suelo hacerlo ni nada así, pero para mí eres una hermosa persona e increíble, ¿sabes?, o sea, no tanto como yo, pero de veras que yo digo: “Wow, qué suerte de tener una amiguita tan especial”.",
      "También me alegra mucho saber que tú eres la única persona que sigue acá, por más errores que cometa."
    ]
  },
  {
    paragraphs: [
      "Por eso te siento que hasta esto es poco, con todo lo que realmente pienso de ti; simplemente quiero que tengas en claro que para mí siempre serás una persona muy increíble, por ahí perfecta en eso, pero no más que yo, obviamente."
    ]
  },
  {
    closing: [
      "En fin, te amo mil ocho mil;",
      "también te adoro, Giselle."
    ]
  }
];

const pagesEl = document.getElementById('pages');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const scene = document.getElementById('scene');

let current = 0;
const cards = [];

pagesData.forEach((data, i) => {
  const card = document.createElement('div');
  card.className = 'card' + (data.closing ? ' closing-page' : '');
  card.style.zIndex = pagesData.length - i;

  let html = '<span class="corner-heart tl">&#10084;</span><span class="corner-heart br">&#10084;</span>';
  if (data.opener) {
    html += '<p class="opener">' + data.opener + '</p><p class="divider">&#10084; &#10084; &#10084;</p>';
  }
  if (data.paragraphs) {
    data.paragraphs.forEach(p => {
      html += '<p class="body-text">' + p + '</p>';
    });
  }
  if (data.closing) {
    html += '<p class="divider">&#10084; &#10084; &#10084;</p>';
    data.closing.forEach(line => {
      html += '<p class="closing">' + line + '</p>';
    });
  }

  card.innerHTML = html;
  pagesEl.appendChild(card);
  cards.push(card);

  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.setAttribute('aria-label', 'Ir a la página ' + (i + 1));
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

function render() {
  cards.forEach((card, i) => {
    card.classList.toggle('flipped', i < current);
  });
  Array.from(dotsEl.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === current);
  });
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pagesData.length - 1;
}

function goTo(index) {
  current = Math.max(0, Math.min(pagesData.length - 1, index));
  render();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

const starCount = 45;
for (let i = 0; i < starCount; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = 3 + Math.random() * 6;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.background = '#e9e2f2';
  s.style.borderRadius = '50%';
  s.style.animationDelay = (Math.random() * 3) + 's';
  s.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
  scene.insertBefore(s, scene.firstChild);
}

render();
</script>

</body>
</html>
