<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesta Especial</title>
    <style>
        /* Fondo espacial con estrellas en movimiento */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Generador de estrellas */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        h1 { font-size: 3rem; color: #ffb7c5; text-shadow: 0 0 10px #ff4d6d; animation: float 3s ease-in-out infinite; }
        p { font-size: 1.2rem; max-width: 600px; line-height: 1.6; text-align: center; color: #e0e0e0; }

        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 30px; transition: 0.4s; margin: 10px; }
        #si { background: #ff4d6d; color: white; box-shadow: 0 0 15px #ff4d6d; }
        #no { background: #555; color: white; }

        #visual { margin-top: 30px; font-size: 6rem; position: relative; }
        
        .onda { position: absolute; border: 2px solid #ff4d6d; border-radius: 50%; animation: ripple 1.5s linear forwards; pointer-events: none; }
        @keyframes ripple { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="stars" id="starfield"></div>

    <h1>¿Te quieres casar conmigo, mi bebecita hermosa?</h1>
    <p>Me gustaría casarme con esta mujer tan hermosa y divina, porque es con vos que quiero pasar el resto de mi vida. Te amo demasiado y espero que este amor que nos tenemos dure toda la vida, mi niña hermosa y perfecta.</p>

    <div>
        <button id="si" onclick="amor()">Sí, acepto</button>
        <button id="no" onclick="roto()">No</button>
    </div>

    <div id="visual"></div>

    <script>
        // Crear estrellas infinitas
        const field = document.getElementById('starfield');
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random() * 3 + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            field.appendChild(s);
        }

        function amor() {
            const v = document.getElementById('visual');
            v.innerHTML = "💗";
            for(let i=0; i<3; i++) {
                const o = document.createElement('div');
                o.className = 'onda';
                o.style.width = o.style.height = "100px";
                o.style.left = "-20px";
                o.style.animationDelay = (i * 0.3) + "s";
                v.appendChild(o);
            }
        }
        function roto() { document.getElementById('visual').innerHTML = "💔"; }
    </script>
</body>
</html>
