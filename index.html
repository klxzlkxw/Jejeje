<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #87CEEB; border-bottom: 5px solid #2d5a27; }
        #text { position: absolute; top: 10%; color: white; font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="text">Aca estan tus manzanas bro</div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;

// Configuración de elementos
let apples = [{x: 350, y: 150, split: false}, {x: 450, y: 180, split: false}, {x: 400, y: 100, split: false}];
let guyX = 400;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Árbol (Tronco y copa)
    ctx.fillStyle = '#5d4037'; ctx.fillRect(380, 250, 40, 150);
    ctx.fillStyle = '#388e3c'; ctx.beginPath(); ctx.arc(400, 200, 80, 0, Math.PI*2); ctx.fill();

    // Manzanas
    apples.forEach(a => {
        ctx.fillStyle = a.split ? '#d32f2f' : '#f44336';
        ctx.beginPath(); ctx.arc(a.x, a.y, 15, 0, Math.PI*2); ctx.fill();
        if(a.split) {
            ctx.fillStyle = "white";
            ctx.fillRect(a.x - 2, a.y - 10, 4, 20); // Línea de partición
        }
    });

    // Muñequito fluido
    guyX = 400 + Math.sin(Date.now() / 300) * 50;
    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(guyX, 420, 20, 0, Math.PI*2); ctx.fill(); // Cabeza
    ctx.fillStyle = "black"; ctx.fillRect(guyX - 5, 440, 10, 40); // Cuerpo

    requestAnimationFrame(draw);
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    apples.forEach(a => { if(Math.hypot(x - a.x, y - a.y) < 30) a.split = true; });
});

draw();
</script>
</body>
</html>
