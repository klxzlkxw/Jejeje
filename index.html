<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Te quiero gis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf1f4;
    --paper:#ffffff;
    --pink:#f2a6b6;
    --pink-deep:#e2879b;
    --text:#4a3f42;
    --text-soft:#8a7a7d;
    --line:#f1dde2;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
  }

  body{
    font-family:'Quicksand', sans-serif;
    background: var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px 12px 40px;
  }

  /* ---------- book wrapper ---------- */
  .book-wrapper{
    perspective: 2200px;
    width: min(90vw, 380px);
  }

  .book{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4.2;
    border-radius: 10px;
    box-shadow: 0 15px 35px rgba(74,63,66,0.15);
  }

  .leaf{
    position:absolute;
    inset:0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 0.9s ease;
    border-radius: 10px;
    backface-visibility: hidden;
    box-shadow: 1px 2px 8px rgba(74,63,66,0.10);
  }

  .leaf.flipped{
    transform: rotateY(-178deg);
  }

  .leaf .face{
    position:absolute;
    inset:0;
    border-radius: 10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background: var(--paper);
  }

  /* ---------- cover ---------- */
  .leaf[data-index="0"] .face{
    align-items:center;
    justify-content:center;
    text-align:center;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 10%;
  }

  .cover-title{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    color: var(--pink-deep);
    margin: 0 0 34px;
  }

  .open-btn{
    padding: 12px 34px;
    border: none;
    border-radius: 30px;
    background: var(--pink);
    color: #fff;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size: 1rem;
    cursor:pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .open-btn:hover{ background: var(--pink-deep); transform: translateY(-1px); }
  .open-btn:active{ transform: translateY(0); }

  /* ---------- content pages ---------- */
  .leaf .face.page-face{
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 12% 9% 10%;
    justify-content:flex-start;
    color: var(--text);
  }

  .page-text{
    font-size: clamp(0.85rem, 2.6vw, 0.98rem);
    line-height: 1.65;
    color: var(--text);
    text-align: left;
    flex: 1;
    overflow:auto;
  }

  .page-num{
    position:absolute;
    bottom: 10px;
    right: 16px;
    font-size: 0.8rem;
    color: var(--text-soft);
  }

  /* ---------- closing page ---------- */
  .leaf[data-index="10"] .face.page-face{
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .closing-heart{
    font-size: 1.8rem;
    color: var(--pink-deep);
    margin-bottom: 12px;
  }
  .closing-sign{
    font-size: 1.05rem;
    color: var(--text-soft);
    margin-top: 14px;
  }

  /* ---------- back cover ---------- */
  .leaf[data-index="11"] .face{
    background: var(--pink);
  }

  /* ---------- controls ---------- */
  .controls{
    margin-top: 20px;
    display:flex;
    align-items:center;
    gap: 20px;
  }

  .nav-btn{
    background: #ffffff;
    border: 1px solid var(--line);
    color: var(--pink-deep);
    width: 40px;
    height:40px;
    border-radius:50%;
    font-size: 1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.2s ease;
  }
  .nav-btn:hover:not(:disabled){ background: var(--pink); color:#fff; }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }

  .page-indicator{
    font-size: 0.9rem;
    color: var(--text-soft);
    min-width: 80px;
    text-align:center;
  }

  @media (max-width: 420px){
    .book-wrapper{ width: 92vw; }
  }
</style>
</head>
<body>

<div class="book-wrapper">
  <div class="book" id="book"></div>
</div>

<div class="controls">
  <button class="nav-btn" id="prevBtn" aria-label="Página anterior">❮</button>
  <span class="page-indicator" id="pageIndicator">cerrado</span>
  <button class="nav-btn" id="nextBtn" aria-label="Página siguiente">❯</button>
</div>

<script>
(function(){
  const bookEl = document.getElementById('book');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const indicator = document.getElementById('pageIndicator');

  // -------- content: edit these freely --------
  const pages = [
    // index 0: cover
    {
      type: 'cover',
      html: `
        <div class="cover-title">Te quiero gis</div>
        <button class="open-btn" id="openSeal">Abrir</button>
      `
    },
    {
      type: 'page',
      text: `Hola, amiguita, quería decirte que te quiero mucho. Sé que esto es raro viniendo de mí, es muy “CURSI”, como tú dices, pero quería recordarte que eres muy importante para mí. Quiero que, por medio de esta “carta” digital, recuerdes eso, que eres muy especial y siempre vas a ser mi persona favorita.`
    },
    {
      type: 'page',
      text: `Mi única amistad valiosa, entre más, no solo la amistad; tú eres especial y muy “valiosa” en dicho sentido. Por el hecho de ser una persona superincreíble, te agradezco porque, a pesar de tantas fases mías muy estúpidas e inmaduras, estuviste acá hasta el día de ahora; siempre decidiste quedarte (a lo mejor no) y permanecer en mi vida, algo que aprecio demasiado.`
    },
    {
      type: 'page',
      text: `Es algo estúpido esto, pero te adoro muchísimo; te diría que te amo, pero eso es raro; aun así, quiero que sepas que es así, demasiado. Dejando eso de lado, sí, eres muy especial y, ya que me dijiste a mi imaginación, quiero recordarte que ya llevas muchos años siendo mi persona favorita; por más que haya más personas llegando, tú sigues destacando de todas formas.`
    },
    {
      type: 'page',
      text: `Quizá a veces hay más prioridades, pero tú siempre fuiste mi única prioridad importante, porque quizá es raro, pero te pondría a ti antes que a quien se supone que me deba importar más. No por falta de respeto o algo así, sino porque me importas más tú, que me has ayudado a mucho.`
    },
    {
      type: 'page',
      text: `Has estado en mi vida mucho tiempo, me viste cambiar a mal, a bien; entre más, te quedaste y nunca te quejabas directamente de mis actitudes, quiero decir, a tal punto de intentar obligarme a cambiar sí o sí, para seguir estando en mi vida.`
    },
    {
      type: 'page',
      text: `Es algo que agradezco demasiado y por eso, te adoro demasiado, y siempre será así. Espero que sea así por muchos años más, porque realmente me importas, chavalín.`
    },
    {
      type: 'page',
      text: `O sea, sí, digo que es raro; no lo es, la verdad, si se trata de decírtelo, porque viene de mi corazón. Quizá me cuesta decirlo; créeme que siempre suelo decir “yo más” o “yo también”, pero tengo el momento para decirte voluntariamente que sí, te amo, te adoro, te quiero y más, por ser esa persona que siempre estuvo conmigo aun siendo a distancia.`
    },
    {
      type: 'page',
      text: `Créeme que mi felicidad se basa en ti. No miento cuando te dije que lloraba por ti, o sea, lo hice, por el hecho de que para mí lo eras todo, lo sigues siendo de tal forma, porque siempre estuviste; quizá no te tengo conmigo a diario, pero estás ahí, me haces feliz incluso por medio de un chat.`
    },
    {
      type: 'page',
      text: `Quizá parezca que a veces soy “feliz” por x persona, pero no como tal, realmente; casi siempre paso estresado o en algo, pero uno de tus mensajes me alegraba el día, porque a pesar de todo, siempre fuiste tú, y serás tú. Sé que me cuesta decírtelo, pero intenté ser mejor por ti; quizá no lo soy aún, no estoy de lo mejor en ese aspecto, pero he hecho demasiado esfuerzo porque sé que vale la pena si es por ti, porque eres una persona muy valiosa en mi vida y me importas demasiado.`
    },
    // closing page
    {
      type: 'closing',
      html: `
        <div class="closing-heart">❤</div>
        <div class="closing-sign">con cariño, siempre.</div>
      `
    },
    // back cover
    { type: 'back' }
  ];

  const total = pages.length;
  let current = 0; // number of leaves already flipped (0 = closed book)

  // build DOM
  pages.forEach((p, i) => {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.dataset.index = i;
    leaf.style.zIndex = total - i;

    const face = document.createElement('div');
    face.className = 'face' + (p.type === 'page' || p.type === 'closing' ? ' page-face' : '');

    if(p.type === 'cover' || p.type === 'closing'){
      face.innerHTML = p.html;
    } else if(p.type === 'page'){
      face.innerHTML = `
        <div class="page-text">${p.text}</div>
        <div class="page-num">${i}</div>
      `;
    } else if(p.type === 'back'){
      face.innerHTML = '';
    }

    leaf.appendChild(face);
    bookEl.appendChild(leaf);
  });

  const leaves = Array.from(bookEl.querySelectorAll('.leaf'));

  function render(){
    leaves.forEach((leaf, i) => {
      leaf.classList.toggle('flipped', i < current);
    });

    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;

    if(current === 0){
      indicator.textContent = 'cerrado';
    } else if(current === total - 1){
      indicator.textContent = 'fin ♥';
    } else {
      indicator.textContent = `pág. ${current} de ${total - 2}`;
    }
  }

  function next(){
    if(current < total - 1){
      current++;
      render();
    }
  }
  function prev(){
    if(current > 0){
      current--;
      render();
    }
  }

  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);

  bookEl.addEventListener('click', function(e){
    if(e.target && e.target.id === 'openSeal'){
      next();
    }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });

  let touchStartX = null;
  bookEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
  bookEl.addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(diff) > 40){
      if(diff < 0) next(); else prev();
    }
    touchStartX = null;
  }, {passive:true});

  render();
})();
</script>

</body>
</html>
