<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #fff0f5; text-align: center; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 3.5rem; color: #d63384; margin-bottom: 20px; }
        p { font-size: 1.3rem; color: #555; max-width: 600px; margin-bottom: 30px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 20px; margin: 10px; }
        #si { background: #ff4d6d; color: white; }
        #no { background: #adb5bd; color: white; }

        /* Efecto de onda explosiva */
        .explosion { position: relative; font-size: 5rem; animation: pulse 0.5s ease-out; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .shake { animation: shake 0.5s; font-size: 5rem; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
    </style>
</head>
<body>

    <h1>¿Te quieres casar conmigo, mi bebecita hermosa?</h1>
    <p>Me gustaría casarme con esta mujer tan hermosa y divina, porque es con vos que quiero pasar el resto de mi vida. Te amo demasiado y espero que este amor que nos tenemos dure toda la vida, mi niña hermosa y perfecta.</p>

    <div>
        <button id="si" onclick="amor()">Sí, acepto</button>
        <button id="no" onclick="roto()">No</button>
    </div>

    <div id="visual"></div>

    <script>
        function amor() {
            const visual = document.getElementById('visual');
            visual.innerHTML = "❤️";
            visual.className = "explosion";
            // Repetir el efecto para que parezca una onda constante
            setTimeout(() => { visual.className = ""; }, 500);
        }
        function roto() {
            document.getElementById('visual').innerHTML = "💔";
            document.getElementById('visual').className = "shake";
        }
    </script>
</body>
</html>
