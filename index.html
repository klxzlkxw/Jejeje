<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let cloudX = 0;
let guyX = 0;

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Nubes en movimiento
    cloudX = (cloudX + 0.5) % canvas.width;
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(cloudX, 100, 40, 0, Math.PI*2); ctx.fill();
    
    // Muñequito simple (caminando)
    guyX = (guyX + 2) % canvas.width;
    ctx.fillStyle = "black";
    ctx.beginPath(); ctx.arc(guyX, 500, 15, 0, Math.PI*2); ctx.fill(); // Cabeza
    ctx.fillRect(guyX-2, 515, 4, 40); // Cuerpo

    requestAnimationFrame(animate);
}
animate();
</script>
