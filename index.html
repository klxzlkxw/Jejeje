<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Te quieres casar conmigo?</title>
    <style>
        body { background: #ffeef2; text-align: center; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 3rem; color: #d63384; margin-bottom: 20px; }
        p { font-size: 1.2rem; color: #555; max-width: 600px; margin-bottom: 30px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 10px; margin: 10px; transition: 0.3s; }
        #si { background: #ff4d6d; color: white; }
        #no { background: #adb5bd; color: white; }
        #visual { margin-top: 20px; font-size: 5rem; }
    </style>
</head>
<body>

    <h1>¿Te quieres casar conmigo, mi bebecita hermosa?</h1>
    <p>Me gustaría casarme con esta mujer tan hermosa y divina, porque es con vos que quiero pasar el resto de mi vida. Te amo demasiado y espero que este amor que nos tenemos dure toda la vida, mi niña hermosa y perfecta.</p>

    <div>
        <button id="si" onclick="amor()">Sí, acepto</button>
        <button id="no" onclick="roto()">No</button>
    </div>

    <div id="visual"></div>

    <script>
        function amor() {
            document.getElementById('visual').innerHTML = "❤️<br>≈ ≈ ≈"; // Representación de ondas
        }
        function roto() {
            document.getElementById('visual').innerHTML = "💔";
        }
    </script>
</body>
</html>
