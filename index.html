<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Moon - Kanye Runner</title>
    <style>
        body { margin: 0; background: #020510; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: monospace; }
        canvas { border: 1px solid #333; background: #020510; cursor: pointer; image-rendering: pixelated; }
    </style>
</head>
<body>
    <h1>MOON RUNNER</h1>
    <canvas id="gameCanvas" width="900" height="400"></canvas>
    <p>Haz clic o presiona ESPACIO para saltar y empezar</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audio = new Audio('moon-kanye.mp3'); // Asegúrate que este archivo esté en la misma carpeta

        let gameState = { x: 80, y: 300, vy: 0, jumping: false };

        function drawMoon() {
            ctx.fillStyle = "#f0f0e8";
            ctx.beginPath(); ctx.arc(750, 80, 40, 0, Math.PI * 2); ctx.fill();
        }

        function update() {
            ctx.clearRect(0, 0, 900, 400);
            drawMoon();
            
            // Dibujar Kanye básico (Pixel Art placeholder)
            ctx.fillStyle = "#B5794A";
            ctx.fillRect(gameState.x, gameState.y, 40, 60);
            
            // Gravedad
            if (gameState.y < 300) { gameState.vy += 0.8; gameState.y += gameState.vy; }
            else { gameState.y = 300; gameState.vy = 0; gameState.jumping = false; }
            
            requestAnimationFrame(update);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !gameState.jumping) {
                gameState.vy = -15;
                gameState.jumping = true;
                if (audio.paused) audio.play();
            }
        });

        canvas.addEventListener('click', () => {
            if (!gameState.jumping) {
                gameState.vy = -15;
                gameState.jumping = true;
                if (audio.paused) audio.play();
            }
        });

        update();
    </script>
</body>
</html>
