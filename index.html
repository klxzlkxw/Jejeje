<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acá están tus manzanas bro 🍎</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    #scene {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 480px;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(180deg, #4FC3F7 0%, #81D4FA 55%, #B3E5FC 84%, #C8E6C9 84%, #81C784 100%);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      cursor: default;
    }

    #title-text {
      position: absolute;
      top: 14px; left: 16px;
      font-size: 13px;
      color: #1a3a5c;
      letter-spacing: 0.04em;
      background: rgba(255,255,255,0.55);
      padding: 5px 14px;
      border-radius: 20px;
      font-style: italic;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(3px);
    }

    #apple-count {
      position: absolute;
      top: 14px; right: 16px;
      font-size: 12px;
      color: #b71c1c;
      background: rgba(255,255,255,0.6);
      padding: 4px 12px;
      border-radius: 16px;
      pointer-events: none;
      z-index: 10;
      transition: all 0.3s ease;
    }

    #sun-svg {
      position: absolute;
      top: 18px; right: 90px;
      width: 70px; height: 70px;
      animation: sunPulse 3s ease-in-out infinite;
    }

    .bird { position: absolute; }
    #bird1 { top: 60px; right: 180px; width: 40px; height: 20px; animation: birdFly 4s ease-in-out infinite; }
    #bird2 { top: 45px; right: 220px; width: 28px; height: 14px; animation: birdFly 5s ease-in-out infinite 1.5s; }

    .cloud { position: absolute; opacity: 0.92; }
    .cloud1 { top: 40px; width: 170px; height: 70px; animation: cloudMove 22s linear infinite; }
    .cloud2 { top: 80px; width: 130px; height: 55px; animation: cloudMove 30s linear infinite 8s; }
    .cloud3 { top: 20px; width: 100px; height: 45px; animation: cloudMove 26s linear infinite 14s; }

    #tree-svg {
      position: absolute;
      left: 50%; bottom: 54px;
      transform: translateX(-50%);
      width: 320px; height: 340px;
      overflow: visible;
    }

    .leaf { animation: leafSway 2.5s ease-in-out infinite; transform-origin: center bottom; }
    .leaf-delay1 { animation-delay: 0.8s; }
    .leaf-delay2 { animation-delay: 1.5s; }

    .apple-group { cursor: pointer; }
    .apple-group:hover .apple-body { filter: brightness(1.18); }
    .apple-wobble {
      animation: appleWiggle 3s ease-in-out infinite;
      transform-origin: center top;
    }

    #ground-svg {
      position: absolute;
      bottom: 52px; left: 0;
      width: 100%; height: 30px;
      pointer-events: none;
    }
    #ground-fill {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 55px;
      background: linear-gradient(180deg, #81C784 0%, #4CAF50 100%);
      border-radius: 0 0 20px 20px;
    }

    .flower { position: absolute; bottom: 55px; pointer-events: none; }
    #flower1 { left: 15%; width: 20px; height: 22px; }
    #flower2 { left: 72%; width: 16px; height: 18px; }
    #flower3 { left: 30%; width: 14px; height: 16px; }

    #stickman {
      position: absolute;
      bottom: 60px; left: -70px;
      width: 60px; height: 80px;
      animation: walkAcross 9s linear infinite;
    }
    #stickman-svg { animation: bobHead 0.5s ease-in-out infinite; }
    .left-arm  { transform-origin: 22px 30px; animation: swingLeftArm  0.5s ease-in-out infinite; }
    .right-arm { transform-origin: 38px 30px; animation: swingRightArm 0.5s ease-in-out infinite; }
    .left-leg  { transform-origin: 26px 61px; animation: swingLeftLeg  0.5s ease-in-out infinite; }
    .right-leg { transform-origin: 34px 61px; animation: swingRightLeg 0.5s ease-in-out infinite; }

    #splits-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .split-left  { animation: splitLeft  0.6s ease-out forwards; }
    .split-right { animation: splitRight 0.6s ease-out forwards; }
    .seed        { animation: seedPop    0.6s ease-out forwards 0.1s; }
    .crunch-text {
      position: absolute;
      font-size: 18px; font-weight: 700;
      color: #FF5722;
      font-family: Georgia, serif;
      white-space: nowrap;
      animation: crunchText 0.8s ease-out forwards;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    @keyframes cloudMove {
      from { transform: translateX(-250px); }
      to   { transform: translateX(920px);  }
    }
    @keyframes sunPulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1;    }
    }
    @keyframes birdFly {
      0%   { transform: translateX(-60px) translateY(0);   }
      50%  { transform: translateX(0px)   translateY(-8px); }
      100% { transform: translateX(60px)  translateY(0);   }
    }
    @keyframes leafSway {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate( 3deg); }
    }
    @keyframes walkAcross {
      from { transform: translateX(0);     }
      to   { transform: translateX(940px); }
    }
    @keyframes bobHead {
      0%, 100% { transform: translateY(0px);  }
      50%      { transform: translateY(-2px); }
    }
    @keyframes swingLeftArm {
      0%, 100% { transform: rotate(-30deg); }
      50%      { transform: rotate( 30deg); }
    }
    @keyframes swingRightArm {
      0%, 100% { transform: rotate( 30deg); }
      50%      { transform: rotate(-30deg); }
    }
    @keyframes swingLeftLeg {
      0%, 100% { transform: rotate(-25deg); }
      50%      { transform: rotate( 25deg); }
    }
    @keyframes swingRightLeg {
      0%, 100% { transform: rotate( 25deg); }
      50%      { transform: rotate(-25deg); }
    }
    @keyframes appleWiggle {
      0%, 100% { transform: rotate(  0deg); }
      25%      { transform: rotate( -5deg); }
      75%      { transform: rotate(  5deg); }
    }
    @keyframes splitLeft {
      0%   { transform: translateX(0)     rotate(  0deg); opacity: 1; }
      100% { transform: translateX(-30px) rotate(-40deg); opacity: 0; }
    }
    @keyframes splitRight {
      0%   { transform: translateX(0)    rotate( 0deg); opacity: 1; }
      100% { transform: translateX(30px) rotate(40deg); opacity: 0; }
    }
    @keyframes seedPop {
      0%   { transform: scale(0) translateY(0);     opacity: 1; }
      100% { transform: scale(1) translateY(-22px); opacity: 0; }
    }
    @keyframes crunchText {
      0%   { transform: scale(0)   translateY(0);     opacity: 1; }
      60%  { transform: scale(1.3) translateY(-15px); opacity: 1; }
      100% { transform: scale(1)   translateY(-32px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-width: 600px) {
      #scene    { height: 320px; border-radius: 12px; }
      #tree-svg { width: 210px; height: 220px; }
      #stickman { width: 40px; height: 55px; }
      #title-text { font-size: 11px; padding: 4px 10px; }
    }
  </style>
</head>
<body>

<div id="scene">

    <ellipse cx="160" cy="55" rx="65" ry="50" fill="#2E7D32" opacity="0.7"/>

<script>
  const NS = 'http://www.w3.org/2000/svg';

  const APPLE_DATA = [
    { cx: 108, cy:  95, stemLen: 16, delay: '0s'   },
    { cx: 148, cy:  62, stemLen: 14, delay: '0.5s' },
    { cx: 192, cy:  58, stemLen: 12, delay: '1s'   },
    { cx: 232, cy:  76, stemLen: 16, delay: '1.5s' },
    { cx:  82, cy: 118, stemLen: 18, delay: '0.8s' },
    { cx: 258, cy: 108, stemLen: 16, delay: '1.3s' },
  ];

  const CRUNCH_WORDS = ['¡CRACK!', '¡SNAP!', '¡CRUNCH!', '¡SPLIT!', '¡POP!', '¡ZAS!'];

  let remaining    = APPLE_DATA.length;
  const countEl    = document.getElementById('apple-count');
  const applesG    = document.getElementById('apples-container');
  const splitsCont = document.getElementById('splits-container');

  function el(tag, attrs = {}) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  }

  function drawApples() {
    while (applesG.firstChild) applesG.removeChild(applesG.firstChild);
    APPLE_DATA.forEach((a, i) => {
      applesG.appendChild(el('line', {
        x1: a.cx, y1: a.cy - 14, x2: a.cx, y2: a.cy - 14 - a.stemLen,
        stroke: '#5D4037', 'stroke-width': '2.5', 'stroke-linecap': 'round'
      }));
      applesG.appendChild(el('ellipse', {
        cx: a.cx + 7, cy: a.cy - 14 - a.stemLen + 2, rx: '7', ry: '4.5', fill: '#66BB6A',
        transform: `rotate(-30,${a.cx + 7},${a.cy - 14 - a.stemLen + 2})`
      }));
      const wobble = el('g', { class: 'apple-wobble' });
      wobble.style.animationDelay  = a.delay;
      wobble.style.transformOrigin = `${a.cx}px ${a.cy - 14}px`;
      wobble.appendChild(el('ellipse', { cx: a.cx, cy: a.cy, rx: '14', ry: '16', fill: '#E53935', class: 'apple-body' }));
      wobble.appendChild(el('ellipse', { cx: a.cx - 4, cy: a.cy - 5, rx: '5', ry: '4', fill: 'white', opacity: '0.35', transform: `rotate(-20,${a.cx - 4},${a.cy - 5})` }));
      wobble.appendChild(el('ellipse', { cx: a.cx, cy: a.cy - 14, rx: '3', ry: '2', fill: '#B71C1C', opacity: '0.5' }));
      const appleG = el('g', { class: 'apple-group', role: 'button', tabindex: '0', 'aria-label': `Manzana ${i + 1}` });
      appleG.appendChild(wobble);
      appleG.addEventListener('click', () => splitApple(appleG, a, i));
      appleG.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') splitApple(appleG, a, i); });
      applesG.appendChild(appleG);
    });
  }

  function splitApple(appleG, a, i) {
    if (!appleG.parentNode) return;
    const prev = appleG.previousSibling;
    const prev2 = prev && prev.previousSibling;
    appleG.style.display = 'none';
    if (prev)  prev.style.display  = 'none';
    if (prev2) prev2.style.display = 'none';

    const treeSvg  = document.getElementById('tree-svg');
    const treeRect  = treeSvg.getBoundingClientRect();
    const sceneRect = document.getElementById('scene').getBoundingClientRect();
    const sx = (treeRect.left - sceneRect.left) + a.cx * (treeRect.width  / 320);
    const sy = (treeRect.top  - sceneRect.top)  + a.cy * (treeRect.height / 340);

    const anim = document.createElementNS(NS, 'svg');
    anim.setAttribute('style', `position:absolute;left:${sx-40}px;top:${sy-25}px;width:90px;height:70px;overflow:visible;pointer-events:none`);
    anim.setAttribute('viewBox', '0 0 90 70');

    const lG = el('g', { class: 'split-left' });
    lG.appendChild(el('path', { d: 'M45 7 Q27 7 25 26 Q23 46 45 52 Z', fill: '#E53935' }));
    lG.appendChild(el('path', { d: 'M45 10 Q37 19 37 30 Q37 42 45 50 Z', fill: '#FFECB3' }));
    lG.appendChild(el('ellipse', { cx:'39', cy:'28', rx:'2.5', ry:'4', fill:'#5D4037', transform:'rotate(-15,39,28)' }));

    const rG = el('g', { class: 'split-right' });
    rG.appendChild(el('path', { d: 'M45 7 Q63 7 65 26 Q67 46 45 52 Z', fill: '#C62828' }));
    rG.appendChild(el('path', { d: 'M45 10 Q53 19 53 30 Q53 42 45 50 Z', fill: '#FFF8E1' }));
    rG.appendChild(el('ellipse', { cx:'51', cy:'28', rx:'2.5', ry:'4', fill:'#4E342E', transform:'rotate(15,51,28)' }));

    const seed = el('ellipse', { cx:'45', cy:'36', rx:'2', ry:'3.5', fill:'#4E342E', class:'seed' });

    anim.appendChild(lG); anim.appendChild(rG); anim.appendChild(seed);
    splitsCont.appendChild(anim);

    const txt = document.createElement('div');
    txt.className   = 'crunch-text';
    txt.textContent = CRUNCH_WORDS[i % CRUNCH_WORDS.length];
    txt.style.left  = (sx - 38) + 'px';
    txt.style.top   = (sy - 52) + 'px';
    splitsCont.appendChild(txt);

    remaining--;
    updateCounter();

    setTimeout(() => {
      anim.remove(); txt.remove();
      if (remaining === 0) {
        setTimeout(() => { remaining = APPLE_DATA.length; updateCounter(); drawApples(); }, 1400);
      }
    }, 950);
  }

  function updateCounter() {
    if (remaining > 0) {
      countEl.textContent = '🍎'.repeat(remaining) + ` ${remaining} manzana${remaining !== 1 ? 's' : ''}`;
    } else {
      countEl.textContent = '¡No quedan manzanas! 😄';
    }
  }

  drawApples();
</script>
